<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: arona-avatar:; connect-src 'self' arona-avatar:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'" />
    <title>CORE Arona Desktop</title>
  </head>
  <body class="startup-pending">
    <main id="app">
      <div id="avatar-stage" aria-label="FRAME アバター領域">
      <canvas id="avatar-canvas" aria-label="3Dアバター"></canvas>
      <canvas id="digital-warp-canvas" aria-hidden="true" hidden></canvas>
      <!-- CSS-only animated transfer starts at the first paint, before Babylon loads. -->
      <div id="startup-transfer" aria-hidden="true"><div class="startup-scan-beam"></div></div>
      <section id="placeholder" aria-label="アバター設定">
        <div class="initial">F</div>
        <div id="status" role="status" aria-live="polite">MMDモデルを選択してください</div>
        <p>PMX / PMDファイルをローカルから読み込みます。</p>
        <div class="placeholder-actions">
          <button id="choose-model" type="button">モデル選択</button>
          <button id="quit-app" type="button">終了</button>
        </div>
      </section>
      </div>
    </main>
    <script type="module" src="/src/renderer.js"></script>
  </body>
</html>
