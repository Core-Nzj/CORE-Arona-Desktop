<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src http://127.0.0.1:32780; object-src 'none'">
  <title>FRAME / Vision Receiver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>FRAME / VISION RECEIVER</h1>
  <p>FRAMEでChrome受信待機を開始し、使い捨てコードを貼り付けてください。</p>
  <label for="token">認証コード</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false" maxlength="64">
  <button id="receive" type="button">FRAMEから画像を受け取る</button>
  <p id="status" role="status" aria-live="polite">未接続</p>
  <img id="preview" alt="FRAMEから受け取ったPNG" hidden>

  <section id="attachment-panel" hidden aria-label="ChatGPTへの添付">
    <h2>CHATGPT / ATTACHMENT TEST</h2>
    <p>現在のChatGPTタブへ画像を添付します。メッセージの送信ボタンは押しません。</p>
    <p id="target">送信先を確認しています…</p>
    <label class="confirm" for="attach-consent">
      <input type="checkbox" id="attach-consent" disabled>
      <span>この画像を表示中のChatGPT会話へ添付することを許可します。添付時にChatGPTへアップロードされる場合があります。</span>
    </label>
    <button id="attach" type="button" disabled>ChatGPTの入力欄へ添付</button>
    <p id="attach-status" role="status" aria-live="polite"></p>
    <button id="discard" type="button" class="secondary">拡張内の画像を消去</button>
  </section>
  <p class="note">画像は拡張内で一時保持し、ファイル保存・自動送信はしません。画像添付が反映されたかはChatGPT画面で確認してください。</p>
  <script src="chatgpt-attach.js"></script>
  <script src="popup.js"></script>
</body>
</html>
